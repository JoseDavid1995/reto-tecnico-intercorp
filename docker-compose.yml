version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: intercorp_mysql
    environment:
      MYSQL_DATABASE: intercorp_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - intercorp-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: intercorp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - intercorp-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: intercorp_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: intercorp_zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://intercorp_kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - intercorp-net

  # --- SERVICIO A: Procesador Batch y Productor ---
  servicio-a:
    build: ./servicio-batch-producer
    container_name: intercorp_servicio_a
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://intercorp_mysql:3306/intercorp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=intercorp_kafka:9092
    depends_on:
      - mysql
      - kafka
    networks:
      - intercorp-net

  # --- SERVICIO B: Consumidor de Eventos ---
  servicio-b:
    build: ./servicio-consumer
    container_name: intercorp_servicio_b
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://intercorp_mysql:3306/intercorp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=intercorp_kafka:9092
    depends_on:
      - mysql
      - kafka
    networks:
      - intercorp-net

  # --- SERVICIO C: API de Monitoreo ---
  servicio-c:
    build: ./servicio-monitoring
    container_name: intercorp_servicio_c
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://intercorp_mysql:3306/intercorp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - mysql
    networks:
      - intercorp-net

volumes:
  mysqldata:

networks:
  intercorp-net:
    driver: bridge